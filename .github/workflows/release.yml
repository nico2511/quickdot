name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error title=Missing secret::${var} is not set."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > presentation/my-release-key.keystore
          chmod 600 presentation/my-release-key.keystore
          # The release keystore is PKCS12. Gradle sets storeType PKCS12; alias and
          # passwords come from KEY_ALIAS, KEYSTORE_PASSWORD, and KEY_PASSWORD.
          {
            echo "keystore_password=$KEYSTORE_PASSWORD"
            echo "key_alias=$KEY_ALIAS"
            echo "key_password=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Play and FOSS releases
        run: ./gradlew assemblePlayRelease assembleFossRelease bundlePlayRelease
        env:
          CI: "true"
          # Play Console license public key. Play release verifies purchase
          # signatures with it. An empty value fails closed (no unlock).
          PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}

      - name: Upload FOSS APK
        uses: actions/upload-artifact@v4
        with:
          name: Quickdot-foss-release-apk
          path: presentation/build/outputs/apk/foss/release/Quickdot-v*-foss-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Play APK
        uses: actions/upload-artifact@v4
        with:
          name: Quickdot-play-release-apk
          path: presentation/build/outputs/apk/play/release/Quickdot-v*-play-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Quickdot-play-release-aab
          path: presentation/build/outputs/bundle/playRelease/Quickdot-v*-play-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f presentation/my-release-key.keystore
