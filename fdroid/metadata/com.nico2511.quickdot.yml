Description: |
  Quickdot is an SMS messenger for Android. It is a fork of Quik, which
  continues QKSMS. Quik and QKSMS are free software under the GNU General
  Public License v3, and Quickdot is released under the same license.
  It displays SMS/MMS conversations, supports scheduled sends, backups, voice
  messages, speech-to-text and text-to-speech, and more.
  Quickdot connects to public APIs (e.g. Space Devs) for news and may fetch
  thumbnails from third-party hosts, so it is marked as NonFreeNet.
