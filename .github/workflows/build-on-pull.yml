name: Build and Test on Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Build with Gradle
      run: ./gradlew assemblePlayDebug assembleFossDebug

    - name: List APK output
      run: ls -R presentation/build/outputs/apk

    - name: Upload Play APK
      uses: actions/upload-artifact@v7
      with:
        name: apk-play-debug
        path: presentation/build/outputs/apk/play/debug/Quickdot-v*-play-debug.apk

    - name: Upload FOSS APK
      uses: actions/upload-artifact@v7
      with:
        name: apk-foss-debug
        path: presentation/build/outputs/apk/foss/debug/Quickdot-v*-foss-debug.apk

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Run Tests
        run: ./gradlew test
